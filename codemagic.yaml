workflows:
  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Codemagic の Settings > Integrations > Developer Portal に
      # 登録済みの App Store Connect API キーの名前
      app_store_connect: shizutify_app_store
    environment:
      groups:
        # Codemagic の App settings > Environment variables に
        # CERTIFICATE_PRIVATE_KEY（RSA秘密鍵・secret扱い）をこのグループ名で登録しておく
        - signing
      vars:
        BUNDLE_ID: com.chanshizu.dengonDaikouMorse
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter パッケージ取得
        script: flutter pub get
      - name: コード生成（Riverpod）
        script: dart run build_runner build --delete-conflicting-outputs
      - name: 静的解析
        script: flutter analyze
      - name: ロジックテスト
        # ゴールデンテストはCI環境のフォントレンダリング差で失敗しうるため除外し、
        # ロジックテストのみ実行する
        script: |
          flutter test \
            test/morse_encoder_test.dart \
            test/morse_decoder_test.dart \
            test/image_transfer_test.dart \
            test/sound_transfer_test.dart
      - name: 署名ファイル取得・適用
        # ios_signing の自動署名は "No matching profiles found" で失敗するため、
        # CLI で証明書・プロファイルを明示的に取得する（なければ作成する）
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: IPA ビルド
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
